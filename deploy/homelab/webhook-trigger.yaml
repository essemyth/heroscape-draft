# Add this entry to spec.triggers in apps/tekton/triggers/webhook.yaml.
# Replace GITHUB_USER with the GitHub account that owns the heroscape-draft repo.
# The image is named after the repo, so the repo must be called "heroscape-draft".
    - name: heroscape-trigger
      interceptors:
        - ref: {name: "cel"}
          params:
            - name: filter
              value: "body.repository.full_name == 'GITHUB_USER/heroscape-draft' && body.ref == 'refs/heads/main'"
            - name: overlays
              value:
                - key: image_name
                  expression: "body.repository.full_name.split('/')[1]"
                - key: dynamic_tag
                  expression: "string(int(body.repository.pushed_at)) + '-' + body.head_commit.id.truncate(7)"
      bindings:
        - ref: git-binding
        - name: dockerfile-path
          value: "Dockerfile"
        - name: build-context
          value: "./"
      template:
        ref: git-template
