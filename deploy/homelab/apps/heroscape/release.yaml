# HeroScape Draft (heroscape.botched.tech). One replica: the SQLite database and photos live
# on a ReadWriteOnce volume, and a single process handles every write.
apiVersion: v1
kind: Namespace
metadata:
  name: heroscape
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: heroscape-data
  namespace: heroscape
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: heroscape
  namespace: heroscape
spec:
  replicas: 1
  # Stop the old pod before starting the new one, so only one ever has the volume.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: heroscape
  template:
    metadata:
      labels:
        app: heroscape
    spec:
      securityContext:
        # The container runs as the "node" user (uid/gid 1000); let it write the volume.
        fsGroup: 1000
      containers:
      - name: heroscape
        image: 192.168.1.196:30500/heroscape-draft:0-0000000 # {"$imagepolicy": "flux-system:heroscape-policy"}
        ports:
        - containerPort: 8000
        env:
        - name: PORT
          value: "8000"
        - name: DATA_DIR
          value: /data
        # SHA-256 of the photo code (the code itself is never stored). To change the code:
        #   node -e "console.log(require('crypto').createHash('sha256').update('NEW-CODE').digest('hex'))"
        - name: PHOTO_CODE_HASH
          value: d310f4bc85f0faf3ab4a184047186389a28cc5fa732eee7ca3c4cdc9a7241c39
        volumeMounts:
        - name: data
          mountPath: /data
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8000
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 30
        resources:
          requests:
            cpu: 50m
            memory: 96Mi
          limits:
            memory: 256Mi
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: heroscape-data
---
apiVersion: v1
kind: Service
metadata:
  name: heroscape-service
  namespace: heroscape
spec:
  type: ClusterIP
  selector:
    app: heroscape
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
